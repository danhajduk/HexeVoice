id: timer
owner: backend
conditions:
  match: all
  items:
    - flag: timer_active
    - flag: idle_ready
sidebars: true
buttons: {preset: standard}
items:
  - item: big_clock
    x: 512
    y: 300
  - item: big_date
    x: 512
    y: 50
  - item: activity_timer
    x: 180
    y: 195
    animations:
      - preset: activity_slide_up
        when: {flag: timer_active}
      - preset: timer_dot
        when: {flag: timer_active}
  - item: timer_primary
    x: 250
    y: 505
  - item: timer_upcoming
    x: 760
    y: 510
