id: thinking
owner: device
conditions:
  match: all
  items:
    - flag: thinking
sidebars: true
buttons: {preset: standard}
items:
  - item: header_clock
  - item: activity_thinking
    x: 512
    y: 295
    animations:
      - preset: activity_slide_up
        when: {flag: thinking}
      - preset: thinking_dots
        when: {flag: thinking}
