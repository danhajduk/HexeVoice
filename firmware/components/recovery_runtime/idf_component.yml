dependencies:
  idf:
    version: '>=5.4'
  espressif/cjson: ^1.7.19~2
  espressif/esp_lcd_st77916: ^2.0.2
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "==3.0.1"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: "==1.6.4"
    matches:
      - if: "idf_version >=6.0"
        version: "==1.6.4"
      - if: "idf_version <6.0"
        version: "0.14.*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: ">=2.11,<3.0"
    matches:
      - if: "idf_version >=6.0"
        version: ">=2.11,<3.0"
      - if: "idf_version <6.0"
        version: "1.4.*"
    rules:
      - if: "target in [esp32p4]"
