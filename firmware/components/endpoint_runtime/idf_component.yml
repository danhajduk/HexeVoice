## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/esp_websocket_client: ^1.6.1
  espressif/cjson: ^1.7.19~2
  espressif/esp-tflite-micro: ^1.4.0
  espressif/esp_codec_dev: ^1.4.0
  espressif/esp_lcd_st77916:
    version: ^2.0.2
    rules:
      - if: "target in [esp32s3] && ${HEXE_BOARD_PROFILE} == waveshare_s3_touch_lcd_1_85c_box_v2"
  espressif/esp_lcd_touch:
    version: ^1.2.0
    rules:
      - if: "target in [esp32s3] && ${HEXE_BOARD_PROFILE} == waveshare_s3_touch_lcd_1_85c_box_v2"
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "==3.0.1"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: "==1.6.4"
    matches:
      - if: "idf_version >=6.0"
        version: "==1.6.4"
      - if: "idf_version <6.0"
        version: "==0.14.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: ">=2.11,<3.0"
    matches:
      - if: "idf_version >=6.0"
        version: ">=2.11,<3.0"
      - if: "idf_version <6.0"
        version: "==1.4.7"
    rules:
      - if: "target in [esp32p4]"
  lvgl/lvgl:
    version: "==9.5.0"
    public: true
    rules:
      - if: "target in [esp32p4]"
