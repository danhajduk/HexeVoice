[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexevoice"
version = "0.1.0"
description = "Starter modular HexeVoice node"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.package-data]
hexevoice = ["assets/weather_icons/*.png", "assets/weather_icons/*.ttf", "assets/weather_icons/*.txt"]
